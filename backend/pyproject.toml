[project]
name = "power-loss-calculator"
version = "0.1.0"
description = "Power semiconductor loss calculation tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.18",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
